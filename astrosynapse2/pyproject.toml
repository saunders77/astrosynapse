[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "astrosynapse2"
version = "0.1.0"
description = "A high-throughput self-play learning system for Star Realms on Apple silicon"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "mlx>=0.32,<0.33",
  "numpy>=2.2,<3",
  "orjson>=3.10,<4",
  "psutil>=7,<8",
  "pydantic>=2.11,<3",
  "safetensors>=0.5,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
astro2 = "astro2.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/astro2"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
